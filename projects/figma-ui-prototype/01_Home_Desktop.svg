    <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity=".05"/>
  </pattern>
</defs>
<rect width="1440" height="1024" fill="url(#bg)"/>
<circle cx="216.0" cy="102.4" r="327.68" fill="url(#glowA)" filter="url(#blur)"/>
