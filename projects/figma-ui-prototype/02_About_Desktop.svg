<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B18"/>
    <stop offset=".5" stop-color="#0B1021"/>
    <stop offset="1" stop-color="#090C18"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset=".48" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <radialGradient id="glowA">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB">
    <stop offset="0" stop-color="#EC4899" stop-opacity=".22"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity=".05"/>
  </pattern>
</defs>
<rect width="1440" height="1024" fill="url(#bg)"/>
<circle cx="216.0" cy="102.4" r="327.68" fill="url(#glowA)" filter="url(#blur)"/>
<circle cx="1180.8" cy="184.32" r="286.72" fill="url(#glowB)" filter="url(#blur)"/>
<rect width="1440" height="1024" fill="url(#dots)" opacity=".9"/>
<!-- About -->
<rect x="64" y="28" width="1312" height="64" rx="22" fill="#0E1528" fill-opacity=".88" stroke="#2F3A58"/><text x="92" y="68" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="850" fill="#F8FAFF" text-anchor="start" opacity="1" letter-spacing="0">EL</text><text x="128" y="67" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#9FA9C4" text-anchor="start" opacity="1" letter-spacing="1.5">EDWARD LAU</text><text x="830" y="67" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">Home</text><text x="922" y="67" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F8FAFF" text-anchor="start" opacity="1" letter-spacing="0">About</text><rect x="922" y="78" width="36.0" height="2" rx="1" fill="#22D3EE"/><text x="1014" y="67" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">Projects</text><text x="1106" y="67" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">Skills</text><text x="1198" y="67" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">Contact</text><rect x="1270" y="43" width="88" height="34" rx="17.0" fill="#151B30" stroke="#34405D" stroke-width="1"/><text x="1314.0" y="65.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F4F7FF" text-anchor="middle" opacity="1" letter-spacing="0">Recruiter</text><rect x="82" y="140" width="132" height="34" rx="17.0" fill="#151B30" stroke="#34405D" stroke-width="1"/><text x="148.0" y="162.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F4F7FF" text-anchor="middle" opacity="1" letter-spacing="0">ABOUT EDWARD</text><text x="82" y="228" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="790" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Creative thinker.</text><text x="82" y="292" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="790" fill="url(#accent)" text-anchor="start" opacity="1" letter-spacing="0">Practical problem solver.</text><text x="82" y="348" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#AAB3CC"><tspan x="82" dy="0">Diploma in Information Technology student with hands-on experience</tspan><tspan x="82" dy="27">across UI, web, programming, AI, cloud and cybersecurity fundamentals.</tspan></text><rect x="82" y="478" width="376" height="200" rx="28" fill="#10172A" stroke="#2D3956" stroke-width="1.2"/><rect x="100" y="496" width="72" height="5" rx="2.5" fill="#EC4899" opacity=".95"/><text x="104" y="540" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Creative &amp; Visual Thinking</text><text x="104" y="574" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#9FA9C4"><tspan x="104" dy="0">I enjoy translating ideas into clear,</tspan><tspan x="104" dy="21">attractive and usable digital</tspan><tspan x="104" dy="21">interfaces.</tspan></text><rect x="482" y="478" width="376" height="200" rx="28" fill="#10172A" stroke="#2D3956" stroke-width="1.2"/><rect x="500" y="496" width="72" height="5" rx="2.5" fill="#22D3EE" opacity=".95"/><text x="504" y="540" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">UI &amp; Interaction Design</text><text x="504" y="574" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#9FA9C4"><tspan x="504" dy="0">Focused on hierarchy, flows, usability,</tspan><tspan x="504" dy="21">visual polish and responsive</tspan><tspan x="504" dy="21">experiences.</tspan></text><rect x="882" y="478" width="450" height="200" rx="28" fill="#10172A" stroke="#2D3956" stroke-width="1.2"/><rect x="900" y="496" width="72" height="5" rx="2.5" fill="#8B5CF6" opacity=".95"/><text x="904" y="540" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Practical Problem Solving</text><text x="904" y="574" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#9FA9C4"><tspan x="904" dy="0">I break larger tasks into manageable</tspan><tspan x="904" dy="21">steps and iterate until the result</tspan><tspan x="904" dy="21">works.</tspan></text><text x="82" y="742" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#22D3EE" text-anchor="start" opacity="1" letter-spacing="1.8">Leadership &amp; community</text><rect x="82" y="778" width="610" height="170" rx="28" fill="#10172A" stroke="#2D3956"/><text x="110" y="820" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="780" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">President — FAME Student Council</text><text x="110" y="858" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5AEC7"><tspan x="110" dy="0">Plan event concepts, activities, venues, sponsors, materials,</tspan><tspan x="110" dy="22">financial reports and team coordination.</tspan></text><rect x="722" y="778" width="610" height="170" rx="28" fill="#10172A" stroke="#2D3956"/><text x="750" y="820" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="780" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Treasurer — LEO Club</text><text x="750" y="858" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5AEC7"><tspan x="750" dy="0">Record income and expenditure, prepare finance reports and</tspan><tspan x="750" dy="22">support community-service initiatives.</tspan></text></svg>