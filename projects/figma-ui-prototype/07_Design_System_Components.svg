<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B18"/>
    <stop offset=".5" stop-color="#0B1021"/>
    <stop offset="1" stop-color="#090C18"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset=".48" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <radialGradient id="glowA">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB">
    <stop offset="0" stop-color="#EC4899" stop-opacity=".22"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity=".05"/>
  </pattern>
</defs>
<rect width="1440" height="1000" fill="url(#bg)"/>
<circle cx="216.0" cy="100.0" r="320.0" fill="url(#glowA)" filter="url(#blur)"/>
<circle cx="1180.8" cy="180.0" r="280.0" fill="url(#glowB)" filter="url(#blur)"/>
<rect width="1440" height="1000" fill="url(#dots)" opacity=".9"/>
<!-- Design System -->
<rect x="82" y="70" width="180" height="34" rx="17.0" fill="#151B30" stroke="#34405D" stroke-width="1"/><text x="172.0" y="92.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F4F7FF" text-anchor="middle" opacity="1" letter-spacing="0">FIGMA DESIGN SYSTEM</text><text x="82" y="154" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="790" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Portfolio UI System</text><text x="82" y="200" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#AAB3CC"><tspan x="82" dy="0">Reusable colors, typography, buttons, chips, cards and glass surfaces based on the</tspan><tspan x="82" dy="25">current Edward Lau portfolio.</tspan></text><text x="82" y="306" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="start" opacity="1" letter-spacing="1.5">Color tokens</text><rect x="82" y="344" width="142" height="112" rx="24" fill="#070B18" stroke="#35405D"/><text x="96" y="486" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Background</text><text x="96" y="506" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">#070B18</text><rect x="258" y="344" width="142" height="112" rx="24" fill="#10172A" stroke="#35405D"/><text x="272" y="486" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Surface</text><text x="272" y="506" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">#10172A</text><rect x="434" y="344" width="142" height="112" rx="24" fill="#22D3EE" stroke="#35405D"/><text x="448" y="486" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Cyan</text><text x="448" y="506" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">#22D3EE</text><rect x="610" y="344" width="142" height="112" rx="24" fill="#8B5CF6" stroke="#35405D"/><text x="624" y="486" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Purple</text><text x="624" y="506" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">#8B5CF6</text><rect x="786" y="344" width="142" height="112" rx="24" fill="#EC4899" stroke="#35405D"/><text x="800" y="486" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Pink</text><text x="800" y="506" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">#EC4899</text><rect x="962" y="344" width="142" height="112" rx="24" fill="#22C55E" stroke="#35405D"/><text x="976" y="486" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Green</text><text x="976" y="506" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" fill="#8F9AB8" text-anchor="start" opacity="1" letter-spacing="0">#22C55E</text><text x="82" y="590" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="start" opacity="1" letter-spacing="1.5">Typography</text><text x="82" y="654" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="800" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Display / 56 / 800</text><text x="82" y="714" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="760" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Section title / 32 / 760</text><text x="82" y="758" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#AAB3CC" text-anchor="start" opacity="1" letter-spacing="0">Body / 16 / 400 — Clear, calm and readable.</text><text x="760" y="590" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="start" opacity="1" letter-spacing="1.5">Components</text><rect x="760" y="630" width="186" height="52" rx="17" fill="url(#accent)"/><text x="853" y="663" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#07101A" text-anchor="middle" opacity="1" letter-spacing="0">Primary Button</text><rect x="962" y="630" width="166" height="52" rx="17" fill="#121A2E" stroke="#34405D"/><text x="1045" y="663" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#F7F9FF" text-anchor="middle" opacity="1" letter-spacing="0">Secondary</text><rect x="1146" y="640" width="112" height="34" rx="17.0" fill="#151B30" stroke="#34405D" stroke-width="1"/><text x="1202.0" y="662.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#F4F7FF" text-anchor="middle" opacity="1" letter-spacing="0">Tag / Chip</text><rect x="760" y="724" width="500" height="190" rx="28" fill="#10172A" stroke="#2D3956" stroke-width="1.2"/><rect x="778" y="742" width="72" height="5" rx="2.5" fill="#EC4899" opacity=".95"/><text x="782" y="786" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#F7F8FF" text-anchor="start" opacity="1" letter-spacing="0">Glass Project Card</text><text x="782" y="820" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#9FA9C4"><tspan x="782" dy="0">Dark glass surface · subtle border ·</tspan><tspan x="782" dy="21">cyan/purple/pink accents</tspan></text></svg>