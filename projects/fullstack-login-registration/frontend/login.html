<!DOCTYPE html>
<html lang="en">
<head>

    <title>Member Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Custom Modal -->
<div id="modalOverlay" class="modal-overlay">
    <div id="modalBox" class="modal-box">
        <h3 id="modalTitle">Message</h3>
        <p id="modalMessage"></p>
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<div class="container">
    <h2>Member Login</h2>

    <form id="loginForm">
        <div class="input-group">
            <input id="loginEmail" type="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <input id="loginPassword" type="password" placeholder="Password" required>
            <span class="toggle" onclick="togglePassword('loginPassword')">Show</span>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        New member? <a href='/projects/fullstack-login-registration/frontend/register'>Register here</a>
    </div>
</div>

<script src="login.js"></script>
<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
