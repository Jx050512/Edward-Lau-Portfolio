<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Student Club Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Custom Modal -->
<div id="modalOverlay" class="modal-overlay">
    <div id="modalBox" class="modal-box">
        <h3 id="modalTitle">Message</h3>
        <p id="modalMessage"></p>
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<div class="container">
    <h2>Student Club Registration</h2>

    <form id="registerForm">
        <div class="input-group">
            <input id="fullName" placeholder="Full Name" required>
        </div>

        <div class="input-group">
            <input id="email" type="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <input id="phone" placeholder="Phone Number" required>
        </div>

        <div class="input-group">
            <input id="password" type="password" placeholder="Password" required>
            <span class="toggle" onclick="toggle('password')">Show</span>
        </div>

        <div class="input-group">
            <input id="confirmPassword" type="password" placeholder="Confirm Password" required>
            <span class="toggle" onclick="toggle('confirmPassword')">Show</span>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="link">
        Already registered? <a href='/projects/fullstack-login-registration/frontend/login'>Login</a>
    </div>
</div>

<script src="validation.js"></script>
<script>
function toggle(id) {
    const i = document.getElementById(id);
    i.type = i.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
